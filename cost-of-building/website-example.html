<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HDCE Website Example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Layout: logo + nav row on white, four overlapping letter blocks running off the bottom edge. */
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --ink: #000000;
    --h: #ECECEC;
    --d: #1B2324;
    --c: #DE7274;
    --e: #E2FF8A;
    --photo: url(photos/building.jpg);
    --mono: 'ABC Areal Semi Mono', 'IBM Plex Mono', ui-monospace, monospace;
    --gutter: clamp(16px, 3.7vw, 71px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--mono); overflow-x: hidden; }

  .site { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
  header {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap;
    padding-inline: var(--gutter); padding-block: clamp(20px, 3vw, 58px) 0;
  }
  .logo { display: block; width: clamp(96px, 7.4vw, 142px); color: var(--ink); }
  .logo svg { display: block; width: 100%; height: auto; overflow: visible; }

  nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: clamp(16px, 2.2vw, 36px); }
  nav a {
    position: relative; display: inline-block; padding-bottom: 6px;
    font-size: 14px; line-height: 1.2; color: var(--ink); text-decoration: none;
  }
  nav a::after {
    content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 8px; max-width: 100%;
    background: var(--ink); transition: width 220ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  nav a:hover::after, nav a:focus-visible::after, nav a.on::after { width: 100%; }
  nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  .blocks {
    position: relative; flex: 1; min-height: clamp(420px, 70vw, 860px);
    margin-inline: var(--gutter); margin-top: clamp(20px, 3.9vw, 74px); overflow: hidden;
  }
  .block {
    position: absolute; width: 26.7%; height: 120%;
  }
  /* One photo shared by all four blocks: each block is a window onto the same picture.
     JS sizes and offsets each .photo so the image lines up across blocks. */
  .photo { position: absolute; background: var(--photo) center / cover no-repeat; }
  .block { overflow: hidden; }
  .block[data-col="0"] { left: 0;      top: calc(2.3% + 20px);  background: var(--h); }
  .block[data-col="1"] { left: 24.8%;  top: calc(12.3% + 20px); background: var(--d); }
  .block[data-col="2"] { left: 48.95%; top: 20px;     background: var(--c); }
  .block[data-col="3"] { right: 0;     top: calc(10.1% + 20px); background: var(--e); }

  .back {
    position: fixed; z-index: 3; left: var(--gutter); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    font: 12px/1 var(--mono); color: var(--ink); background: var(--bg);
    border: 1px solid var(--ink); padding: 10px 12px; text-decoration: none;
  }
  .back:hover { background: var(--ink); color: var(--bg); }

  @media (max-width: 640px) {
    header { flex-direction: column; }
    .block { width: 34%; }
    .block[data-col="1"] { left: 22%; }
    .block[data-col="2"] { left: 44%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; } }
</style>
</head>
<body>
<div class="site">
  <header>
    <a class="logo" href="#" aria-label="Homes that Don't Cost the Earth, home">
      <svg id="logo" viewBox="198 262 330 198" aria-hidden="true"></svg>
    </a>
    <nav aria-label="Main">
      <ul>
        <li><a href="#about" data-col="0">About</a></li>
        <li><a href="#mission" data-col="1">Mission</a></li>
        <li><a href="#team" data-col="2">Team</a></li>
        <li><a href="#contact" data-col="3">Get in Touch</a></li>
      </ul>
    </nav>
  </header>
  <div class="blocks" aria-hidden="true">
    <div class="block" data-col="0"></div>
    <div class="block" data-col="1"></div>
    <div class="block" data-col="2"></div>
    <div class="block" data-col="3"></div>
  </div>
</div>

    ph.style.height = H + 'px';
  });
}
placePhotos();
addEventListener('resize', placePhotos);
const none = () => set([false, false, false, false]);

// Logo: hovering it reveals the stacked wordmark.
const logo = document.querySelector('.logo');
logo.addEventListener('pointerenter', () => showWord(true));
logo.addEventListener('pointerleave', () => showWord(false));
logo.addEventListener('focus', () => showWord(true));
logo.addEventListener('blur', () => showWord(false));
logo.addEventListener('click', e => e.preventDefault());

// Blocks and nav: each one opens its letter.
blocks.forEach((b, c) => {
  b.addEventListener('pointerenter', () => set(only(c)));
  b.addEventListener('pointerleave', none);
});
links.forEach((a, c) => {
  a.addEventListener('pointerenter', () => set(only(c)));
  a.addEventListener('pointerleave', none);
  a.addEventListener('focus', () => set(only(c)));
  a.addEventListener('blur', none);
  a.addEventListener('click', e => e.preventDefault());
});

render();
</script>
</body>
</html>
