<style>
  :root { --bg: #D9D9D9; --ink: #111111; --muted: #444444; --tile: #FFFFFF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Mono', monospace; transition: background 300ms; }
  main { max-width: 1724px; margin: 0 auto; padding: 56px 64px; display: flex; flex-direction: column; gap: 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 500; }
  .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .controls { display: flex; gap: 8px; align-items: center; }
  .site-link { font: inherit; font-size: 12px; background: transparent; cursor: pointer; color: var(--ink); border: 1px solid var(--ink); padding: 8px 12px; text-decoration: none; margin-right: 8px; }
  .site-link:hover { background: var(--ink); color: var(--tile); }
  .swatch { width: 28px; height: 28px; padding: 0; border: 1px solid var(--ink); cursor: pointer; }
  section { display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.02em; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  figcaption { font-size: 12px; color: var(--muted); }
  .tile {
    display: block; width: 100%; aspect-ratio: 1; border: 0; margin: 0; padding: 0;
    background: var(--tile); cursor: crosshair; touch-action: pan-y;
  }
  .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .tile svg { display: block; width: 100%; height: 100%; overflow: hidden; }
  .fill-box { transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes march { to { stroke-dashoffset: -40; } }
  .march { animation: march 0.9s linear infinite; }
  @media (max-width: 600px) { main { padding: 32px 16px; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; animation: none !important; } }
</style>

    apply(s, prev);
  };

  btn.addEventListener('pointermove', e => {
    const r = btn.getBoundingClientRect();
    const vx = s.vb.x + s.vb.w * ((e.clientX - r.left) / r.width);
    const c = colAt(vx);
    // Wordmarks swap as a whole (no half-letters, half-words); the rest open letter by letter.
    setOpen([0, 1, 2, 3].map(i => s.word || i === c));
  });
  // Moving off a tile returns it to the page's resting state (all open or all closed).
  btn.addEventListener('pointerleave', () => setOpen(rest()));
  btn.addEventListener('focus', () => setOpen([true, true, true, true]));
  btn.addEventListener('blur', () => setOpen(rest()));
  s.setOpen = setOpen;

  apply(s, null, true);
  tiles.push(s);
  return fig;
}

function apply(s, prev, instant) {
  const { t, parts, open } = s;
  const fade = t.letters === 'fade';
  const ldx = t.dx + (t.ldx || 0);
  // Per column: pick opening or closing timing depending on which way it is going.
  const tm = c => (open[c] ? OPEN : CLOSE);
  // Wordmarks open H → D → C → E and close E → C → D → H.
  const stag = c => !s.word ? 0 : (open[c] ? c : 3 - c) * WORD_STAGGER;
  const tr = (prop, c, extra = 0) => instant ? 'none'
    : `${prop} ${tm(c).dur}ms ${tm(c).ease} ${extra + stag(c)}ms`;

  parts.caps.forEach(({ n, col, i }) => {
    n.style.transition = tr('transform', col);
    n.style.transform = `translate(${t.dx}px, ${open[col] ? s.capOpen[i] : 0}px)`;
  });

  // Letters stay put; in "fade" designs they just disappear while their column is open.
  const anyOpen = open.some(Boolean);
  parts.letters.forEach(({ n, col }) => {
    const on = s.word ? anyOpen : open[col];
    n.style.transition = instant ? 'none' : `opacity ${on ? 100 : 160}ms linear ${on ? 0 : 140}ms`;
    n.style.transform = `translate(${ldx}px, 0px)`;
    n.style.opacity = fade && on ? 0 : 1;
  });

  if (parts.text) {
    parts.text.style.transition = instant ? 'none' : `opacity ${anyOpen ? 180 : 120}ms linear ${anyOpen ? 100 : 0}ms`;
    parts.text.style.opacity = anyOpen ? 1 : 0;
  }

  parts.rects.forEach(({ n, cols }) => {
    const c = cols[0];
    n.style.transition = tr('transform', c, tm(c).bar);
    n.style.transform = `scaleY(${open[c] ? 1 : 0})`;
  });

  parts.dashes.forEach(({ n, cols }) => {
    const on = cols.some(c => open[c]);
    const c = cols.find(k => open[k]) ?? cols[0] ?? 0;
    n.style.transition = instant ? 'none'
      : `${tr('transform', c, tm(c).bar)}, opacity 150ms linear ${on ? 0 : 150}ms`;
    n.style.transform = `scaleY(${on ? 1 : 0})`;
    n.style.opacity = on ? 1 : 0;
  });

}

const rowsEl = document.getElementById('rows');
LABELS.forEach((labelText, ri) => {
  const sec = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = labelText;
  const grid = document.createElement('div');
  grid.className = 'grid';
  DATA.tiles.filter(t => t.row === ri).forEach(t => grid.appendChild(buildTile(t)));
  sec.append(h, grid);
  rowsEl.appendChild(sec);
});

// Measure each logo fully open (and closed), in its own SVG units.
function measure(s) {
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const vb = s.vb;
  const read = () => {
    const sr = s.svg.getBoundingClientRect();
    const k = vb.w / sr.width;
    s.svg.querySelectorAll('path, line, text, image, svg > rect').forEach(n => {
      const r = n.getBoundingClientRect();
      if (!r.width && !r.height) return;
      const pad = n.tagName === 'line' ? 3 : 0;
      box.x0 = Math.min(box.x0, vb.x + (r.left - sr.left) * k - pad);
      box.x1 = Math.max(box.x1, vb.x + (r.right - sr.left) * k + pad);
      box.y0 = Math.min(box.y0, vb.y + (r.top - sr.top) * k);
      box.y1 = Math.max(box.y1, vb.y + (r.bottom - sr.top) * k);
    });
  };
  s.open = [true, true, true, true]; apply(s, null, true); read();
  s.open = [false, false, false, false]; apply(s, null, true); read();
  return box;
}

// One shared scale so every option stays the same size, each centred in its tile,
// with the biggest open logo getting PAD on every side.
function fitAll() {
  tiles.forEach(s => { s.vb = { x: 100, y: 100, w: 526 }; s.svg.setAttribute('viewBox', '100 100 526 526'); });
  const boxes = tiles.map(measure);
  const size = Math.max(...boxes.map(b => Math.max(b.x1 - b.x0, b.y1 - b.y0)));
  const w = size / (1 - 2 * PAD);
  tiles.forEach((s, i) => {
    const b = boxes[i];
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    s.vb = { x: cx - w / 2, y: cy - w / 2, w };
    s.svg.setAttribute('viewBox', `${s.vb.x} ${s.vb.y} ${w} ${w}`);
    s.open = rest(); apply(s, null, true);
  });
}
document.fonts.ready.then(fitAll);

const restBtn = document.getElementById('rest');
restBtn.addEventListener('click', () => {
  restOpen = !restOpen;
  restBtn.setAttribute('aria-pressed', String(restOpen));
  restBtn.textContent = restOpen ? 'Showing open' : 'Showing closed';
  tiles.forEach(s => s.setOpen(rest()));
});

document.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => {
  document.documentElement.style.setProperty('--bg', b.dataset.bg);
}));
</script>
