<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homes that Don't Cost the Earth</title>
<style>
  :root {
    --fill: #ffffff;
    --ink: #1a1a1a;
    --house-w: 7vw;
    --yellow: #fffdc7;   /* from the logo; the only yellow on the page */
    --glow: var(--yellow);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--fill); }
  main { display: flex; width: 100vw; height: 100vh; }

  .half { position: relative; flex: 1; overflow: hidden; }
  .forest { background: url(forest.jpg) center / cover no-repeat; }
  .field { background: var(--fill); cursor: crosshair; touch-action: none; user-select: none; }

  /* both houses and holes are centered on the click point */
  .house, .hole {
    position: absolute;
    width: var(--house-w);
    aspect-ratio: 2000 / 1931;
    transform: translate(-50%, -50%) rotate(var(--r)) scale(var(--s));
    pointer-events: none;
  }

  /* paper cut-out: lifted and tilted, then settles flat onto the page */
  .house {
    filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .22));
    animation: lay 0.5s cubic-bezier(.3, .7, .3, 1) both;
  }
  @keyframes lay {
    from {
      opacity: 0;
      transform: translate(-50%, -58%) rotate(var(--r0)) scale(calc(var(--s) * 1.1));
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, .2));
    }
    25% { opacity: 1; }
  }
  /* the picture lives in a masked child so the mask doesn't clip the drop shadow */
  .paper {
    position: absolute;
    inset: 0;
    background: url(house.png) center / contain no-repeat;
  }

  /* the hole uses the house's own alpha as its outline */
  .hole {
    background: var(--fill);
    animation: cut 0.5s ease both;
  }
  .hole, .paper {
    -webkit-mask: url(house.png) center / contain no-repeat;
            mask: url(house.png) center / contain no-repeat;
  }
  /* inner shadow: a blurred, slightly offset "everything except the house" layer,
     clipped by the parent's mask so only its inside edge shows */
  .hole::before, .paper::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--glow);
    filter: blur(2px);
    -webkit-mask:
      url(house.png) calc(50% + 2px) calc(50% + 3px) / contain no-repeat,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask:
      url(house.png) calc(50% + 2px) calc(50% + 3px) / contain no-repeat exclude,
      linear-gradient(#000 0 0);
  }
  @keyframes cut { from { opacity: 0; } }

  .hint, .count {
    position: fixed;
    font: 500 13px/1.3 system-ui, sans-serif;
    color: var(--ink);
    pointer-events: none;
  }
  .hint { right: 20px; bottom: 20px; transition: opacity .4s; }
  .count { right: 20px; top: 20px; z-index: 2; padding: 4px 8px; background: var(--fill); font-variant-numeric: tabular-nums; }
  .count:empty { display: none; }

  /* logo sits at the top of the seam; swaps to the emoji version on hover */
  .logo {
    position: fixed;
    left: 50%; top: calc(20px + env(safe-area-inset-top, 0px)); z-index: 2;
    width: 220px;
    max-width: 40vw;
    aspect-ratio: 109 / 72;
    transform: translateX(-50%);
  }
  .logo svg { display: block; width: 100%; height: 100%; }
  /* on hover three letters roll over like cubes to show emoji:
     the house, the cost, the earth. 1 logo unit = 100cqw / 109 */
  .logo { container-type: inline-size; }
  .cube {
    position: absolute;
    width: 11.009%;
    height: 15.278%;
    perspective: 60cqw;
  }
  .spin {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: translateZ(calc(-5.5 * 100cqw / 109)) rotateX(0deg);
    transition: transform .55s cubic-bezier(.45, 0, .2, 1.25);
    transition-delay: calc(var(--i) * 70ms);
  }
  .logo:hover .spin { transform: translateZ(calc(-5.5 * 100cqw / 109)) rotateX(90deg); }
  .face {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front { transform: translateZ(calc(5.5 * 100cqw / 109)); }
  /* the emoji sits on the cube's bottom face and rolls up into view */
  .under {
    display: grid;
    place-items: center;
    font-size: calc(10 * 100cqw / 109);
    line-height: 1;
    transform: rotateX(-90deg) translateZ(calc(5.5 * 100cqw / 109));
  }

  .warning {
    position: fixed;
    left: 50%; top: 50%; z-index: 3;
    transform: translate(-50%, -40%);
    max-width: calc(100vw - 32px);
    padding: 14px 20px;
    background: var(--ink);
    color: #fff;
    font: 400 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-align: center;
    opacity: 0;
    transition: opacity .5s, transform .5s;
    pointer-events: none;
  }
  .warning.show { opacity: 1; transform: translate(-50%, -50%); }
  .warning button {
    margin-left: 12px;
    background: none; border: 0;
    color: var(--yellow);
    font: inherit; text-decoration: underline;
    cursor: pointer;
    pointer-events: auto;
  }

  @media (max-width: 700px) { :root { --house-w: 12vw; } }
</style>
</head>
<body>
<main>
  <section class="half forest" id="forest" aria-label="Forest"></section>
  <section class="half field" id="field" aria-label="Click or drag to build houses"></section>
</main>

<p class="count" id="count"></p>
<p class="hint" id="hint">click or drag to build</p>
<div class="warning" id="warning" role="status">
  The current model is not sustainable under this rate of consumption.
  <button id="reset">Start over</button>
</div>

<script>
  const forest = document.getElementById('forest');
  const field = document.getElementById('field');
  const countEl = document.getElementById('count');
  const hint = document.getElementById('hint');
  const warning = document.getElementById('warning');

  const WARN_AT = 0.45;   // fraction of forest cleared before the warning shows
  const GRID = 120;       // resolution of the coverage map

  // low-res offscreen map of how much forest has been cleared
  const map = document.createElement('canvas');
  map.width = map.height = GRID;
  const ctx = map.getContext('2d', { willReadFrequently: true });
  const houseImg = new Image();
  houseImg.src = 'house.png';

  let built = 0;

  function place(parent, cls, x, y, scale, rot, rot0) {
    const el = document.createElement('div');
    el.className = cls;
    el.style.left = x * 100 + '%';
    el.style.top = y * 100 + '%';
    el.style.setProperty('--s', scale);
    el.style.setProperty('--r', rot + 'deg');
    el.style.setProperty('--r0', rot0 + 'deg');
    if (cls === 'house') el.appendChild(Object.assign(document.createElement('i'), { className: 'paper' }));
    parent.appendChild(el);
  }

  function coverage() {
    const data = ctx.getImageData(0, 0, GRID, GRID).data;
    let filled = 0;
    for (let i = 3; i < data.length; i += 4) if (data[i] > 127) filled++;
    return filled / (GRID * GRID);
  }

  function build(e) {
    const r = field.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    const scale = 0.85 + Math.random() * 0.3;
    const rot = (Math.random() * 2 - 1) * 4;                                   // final tilt, ±4°
    const rot0 = rot + (Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * 6); // tilt while lifted

    place(field, 'house', x, y, scale, rot, rot0);
    place(forest, 'hole', x, y, scale, rot, rot);   // same spot and tilt on the forest side

    // stamp the house onto the coverage map (in the half's proportions)
    const wPx = houseWidth() * scale;
    const w = wPx / r.width * GRID;
    const h = (wPx * 1931 / 2000) / r.height * GRID;
    ctx.drawImage(houseImg, x * GRID - w / 2, y * GRID - h / 2, w, h);

    built++;
    const cleared = coverage();
    countEl.textContent = built + (built === 1 ? ' house' : ' houses') + ' · ' + Math.round(cleared * 100) + '% forest cleared';
    hint.style.opacity = 0;

    if (cleared >= WARN_AT) warning.classList.add('show');
  }

  function houseWidth() {
    return parseFloat(getComputedStyle(field).getPropertyValue('--house-w')) / 100 * innerWidth;
  }

  // click places one house; dragging lays a trail of them
  const SPACING = 0.6;   // gap between dragged houses, as a fraction of house width
  let last = null;

  field.addEventListener('pointerdown', (e) => {
    field.setPointerCapture(e.pointerId);
    last = { x: e.clientX, y: e.clientY };
    build(e);
  });
  field.addEventListener('pointermove', (e) => {
    if (!last) return;
    const r = field.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    if (Math.hypot(e.clientX - last.x, e.clientY - last.y) < houseWidth() * SPACING) return;
    last = { x: e.clientX, y: e.clientY };
    build(e);
  });
  const stop = () => { last = null; };
  field.addEventListener('pointerup', stop);
  field.addEventListener('pointercancel', stop);

  document.getElementById('reset').addEventListener('click', () => {
    document.querySelectorAll('.house, .hole').forEach(el => el.remove());
    ctx.clearRect(0, 0, GRID, GRID);
    built = 0;
    countEl.textContent = '';
    hint.style.opacity = 1;
    warning.classList.remove('show');
  });
</script>
